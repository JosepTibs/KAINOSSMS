<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Kainos SMS</title>
    <link rel="icon" type="image/x-icon" href="/public/KainosLogo.png">

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        font-family: 'Open Sans', sans-serif;
        background-color: #fdf9f2;
        color: #333333;
      }
      h1, h2, h3, .nav-link {
        font-family: 'Poppins', sans-serif;
      }
      input:focus {
        outline: none;
      }
    </style>
  </head>

  <body class="bg-[#fdf9f2] min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <!-- Logo -->
          <div class="flex items-center space-x-2">
            <img src="/public/KainosLogo.png" alt="Kainos Logo" class="h-10 w-10" />
            <a href="/" class="text-2xl font-bold text-[#F47C2B]">KAINOS SMS</a>
          </div>

          <!-- Desktop Menu -->
          <div class="hidden md:flex space-x-8">
            <a href="/" class="nav-link text-[#1E4B87] hover:text-[#F47C2B]">Home</a>
            <a href="/about.html" class="nav-link text-[#1E4B87] hover:text-[#F47C2B]">About</a>
            <a href="/contact.html" class="nav-link text-[#1E4B87] hover:text-[#F47C2B]">Contact</a>
            <a href="/register.html" class="nav-link text-[#1E4B87] hover:text-[#F47C2B]">Register</a>
          </div>

          <!-- Mobile Menu Button -->
          <button
            id="menu-btn"
            class="md:hidden text-[#1E4B87] hover:text-[#F47C2B] focus:outline-none"
            aria-label="Toggle menu"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div
        id="mobile-menu"
        class="hidden md:hidden px-5 pt-4 pb-2 space-y-2 bg-white border-t transition-all duration-300 ease-in-out"
      >
        <a href="/" class="block text-[#1E4B87] hover:text-[#F47C2B]">Home</a>
        <a href="/about.html" class="block text-[#1E4B87] hover:text-[#F47C2B]">About</a>
        <a href="/contact.html" class="block text-[#1E4B87] hover:text-[#F47C2B]">Contact</a>
        <a href="/register.html" class="block text-[#1E4B87] hover:text-[#F47C2B]">Register</a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6">
      <div class="bg-white shadow-lg rounded-2xl p-8 max-w-md w-full transition transform hover:scale-[1.01] duration-200">
        <h1 class="text-3xl font-bold text-center text-[#1E4B87] mb-6">
          Sign In to Kainos SMS
        </h1>
        <form id="login-form" class="space-y-5">
          <div>
            <label for="email" class="block font-semibold mb-1 text-[#333333]">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-[#F47C2B]"
              required
            />
          </div>
          <div>
            <label for="password" class="block font-semibold mb-1 text-[#333333]">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-[#F47C2B]"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full bg-[#F47C2B] text-white font-semibold py-2.5 rounded-lg hover:bg-[#e36e21] transition"
          >
            Sign In
          </button>
        </form>

        <p class="text-sm text-center text-gray-500 mt-4">
          Don’t have an account?
          <a href="/authorization/Signup.html" class="text-[#1E4B87] hover:underline font-semibold">Register</a>
        </p>
      </div>
    </main>

    <script>
      // Toggle Mobile Menu
      const menuBtn = document.getElementById('menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });

      // Prevent reload (for future backend logic)
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();

        // Placeholder for Supabase logic
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        console.log('Login attempt:', { email, password });

        // TODO: Add Supabase login logic here
      });
    </script>
  </body>
</html>
