<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students - Kainos Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex bg-[#fdf9f2] text-[#333]">
    <!-- Sidebar -->
<aside
  class="w-64 bg-white border-r border-gray-200 shadow-md hidden md:flex flex-col justify-between"
>
  <div>
    <!-- Logo -->
    <div class="flex items-center space-x-2 p-6 border-b">
      <img src="/KainosLogo.jpg" alt="Kainos Logo" class="h-10 w-10" />
      <span class="text-2xl font-bold text-[#F47C2B]">Kainos</span>
    </div>

    <!-- Nav Links -->
    <nav class="mt-6 flex flex-col space-y-1">
      <a href="/admin/index.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full active">Dashboard</a>
      <a href="/admin/teachers.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Teachers</a>
      <a href="/admin/students.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Students</a>
      <a href="/admin/parents.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Parents</a>
      <a href="/admin/announcements.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Announcements</a>
    </nav>
  </div>

  <!-- Profile -->
  <div class="p-6 border-t">
    <div class="flex items-center space-x-3">
      <img src="/assets/profile.png" alt="Admin" class="h-10 w-10 rounded-full border" />
      <div>
        <p class="font-semibold text-[#1E4B87]">Admin Name</p>
        <p class="text-sm text-gray-500">Administrator</p>
      </div>
    </div>
    <button
      id="logout-btn"
      class="mt-4 w-full text-sm bg-[#F47C2B] text-white font-semibold py-2 rounded-lg hover:bg-[#e36e21] transition"
    >
      Log Out
    </button>
  </div>
</aside>


    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[#1E4B87]">Students</h1>
        <button id="addStudentBtn" class="bg-[#F47C2B] text-white px-4 py-2 rounded-lg font-semibold hover:bg-[#e36e21]">+ Add Student</button>
      </div>

      <!-- Grade Tabs -->
      <div class="flex flex-wrap gap-3 mb-6">
        <button class="grade-tab bg-[#1E4B87] text-white px-3 py-2 rounded-lg" data-grade="1">Grade 1</button>
        <button class="grade-tab bg-white border px-3 py-2 rounded-lg" data-grade="2">Grade 2</button>
        <button class="grade-tab bg-white border px-3 py-2 rounded-lg" data-grade="3">Grade 3</button>
        <button class="grade-tab bg-white border px-3 py-2 rounded-lg" data-grade="4">Grade 4</button>
        <button class="grade-tab bg-white border px-3 py-2 rounded-lg" data-grade="5">Grade 5</button>
        <button class="grade-tab bg-white border px-3 py-2 rounded-lg" data-grade="6">Grade 6</button>
      </div>

      <div id="studentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Modal -->
    <div id="studentModal" class="hidden fixed inset-0 bg-black bg-opacity-40 items-center justify-center z-50">
      <div class="bg-white w-full max-w-lg p-6 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-semibold text-[#1E4B87] mb-4">Add Student</h2>
        <form id="studentForm" class="space-y-4">
          <input type="hidden" id="studentId" />
          <div>
            <label class="block text-sm font-medium">Full Name</label>
            <input id="studentName" type="text" required class="mt-1 w-full border rounded-lg px-4 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium">Grade Level</label>
            <select id="studentGrade" class="mt-1 w-full border rounded-lg px-4 py-2">
              <option value="1">Grade 1</option>
              <option value="2">Grade 2</option>
              <option value="3">Grade 3</option>
              <option value="4">Grade 4</option>
              <option value="5">Grade 5</option>
              <option value="6">Grade 6</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium">Parent Name</label>
            <input id="studentParent" type="text" class="mt-1 w-full border rounded-lg px-4 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium">Photo</label>
            <input id="studentPhoto" type="file" accept="image/*" class="mt-1 w-full" />
            <img id="studentPreview" class="mt-3 w-20 h-20 rounded-full object-cover hidden" />
          </div>
          <div class="flex justify-end space-x-3">
            <button type="button" id="cancelStudentModal" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-[#F47C2B] text-white rounded-lg">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const modal = document.getElementById('studentModal');
      const addBtn = document.getElementById('addStudentBtn');
      const cancelBtn = document.getElementById('cancelStudentModal');
      const form = document.getElementById('studentForm');
      const grid = document.getElementById('studentGrid');
      const tabs = document.querySelectorAll('.grade-tab');
      const photoInput = document.getElementById('studentPhoto');
      const preview = document.getElementById('studentPreview');
      let currentGrade = 1;
      let students = JSON.parse(localStorage.getItem('students')) || [];
      let uploadedPhoto = '';

      const saveData = () => localStorage.setItem('students', JSON.stringify(students));
      const renderStudents = () => {
        grid.innerHTML = '';
        const filtered = students.filter(s => s.grade == currentGrade);
        if (!filtered.length) {
          grid.innerHTML = `<p class="text-gray-500 col-span-full">No students in Grade ${currentGrade}.</p>`;
          return;
        }
        filtered.forEach(st => {
          const card = document.createElement('div');
          card.className = 'bg-white p-5 rounded-2xl shadow hover:shadow-lg transition';
          card.innerHTML = `
            <div class="flex items-center space-x-3">
              <img src="${st.photo || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full object-cover">
              <div>
                <h2 class="text-xl font-semibold text-[#1E4B87]">${st.name}</h2>
                <p class="text-sm text-gray-600">Parent: ${st.parent || '-'}</p>
              </div>
            </div>
            <div class="flex justify-end mt-4 space-x-3">
              <button class="text-[#1E4B87]" onclick="editStudent(${st.id})">✏️</button>
              <button class="text-red-500" onclick="deleteStudent(${st.id})">🗑️</button>
            </div>`;
          grid.appendChild(card);
        });
      };

      tabs.forEach(tab => tab.addEventListener('click', () => {
        tabs.forEach(t => t.className = 'grade-tab bg-white border px-3 py-2 rounded-lg');
        tab.className = 'grade-tab bg-[#1E4B87] text-white px-3 py-2 rounded-lg';
        currentGrade = tab.dataset.grade;
        renderStudents();
      }));

      photoInput.onchange = e => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = ev => {
            uploadedPhoto = ev.target.result;
            preview.src = uploadedPhoto;
            preview.classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      };

      addBtn.onclick = () => {
        form.reset(); uploadedPhoto = ''; preview.classList.add('hidden');
        document.getElementById('studentId').value = '';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      };
      cancelBtn.onclick = () => modal.classList.add('hidden');

      form.onsubmit = e => {
        e.preventDefault();
        const id = document.getElementById('studentId').value;
        const data = {
          id: id || Date.now(),
          name: document.getElementById('studentName').value,
          grade: parseInt(document.getElementById('studentGrade').value),
          parent: document.getElementById('studentParent').value,
          photo: uploadedPhoto
        };
        if (id) students = students.map(s => s.id == id ? data : s);
        else students.push(data);
        saveData(); renderStudents(); modal.classList.add('hidden');
      };

      window.editStudent = id => {
        const s = students.find(st => st.id == id);
        document.getElementById('studentId').value = s.id;
        document.getElementById('studentName').value = s.name;
        document.getElementById('studentGrade').value = s.grade;
        document.getElementById('studentParent').value = s.parent;
        uploadedPhoto = s.photo;
        if (uploadedPhoto) { preview.src = uploadedPhoto; preview.classList.remove('hidden'); }
        modal.classList.remove('hidden');
      };

      window.deleteStudent = id => {
        if (confirm('Delete this student?')) {
          students = students.filter(s => s.id != id);
          saveData(); renderStudents();
        }
      };

      renderStudents();
    </script>
  </body>
</html>
