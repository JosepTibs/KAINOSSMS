<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachers - Kainos Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex bg-[#fdf9f2] text-[#333]">
    <!-- Sidebar -->
<aside
  class="w-64 bg-white border-r border-gray-200 shadow-md hidden md:flex flex-col justify-between"
>
  <div>
    <!-- Logo -->
    <div class="flex items-center space-x-2 p-6 border-b">
      <img src="/KainosLogo.jpg" alt="Kainos Logo" class="h-10 w-10" />
      <span class="text-2xl font-bold text-[#F47C2B]">Kainos</span>
    </div>

    <!-- Nav Links -->
    <nav class="mt-6 flex flex-col space-y-1">
      <a href="/admin/index.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full active">Dashboard</a>
      <a href="/admin/teachers.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Teachers</a>
      <a href="/admin/students.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Students</a>
      <a href="/admin/parents.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Parents</a>
      <a href="/admin/announcements.html" class="nav-link px-6 py-3 text-[#1E4B87] hover:bg-[#f47c2b] hover:text-white rounded-r-full">Announcements</a>
    </nav>
  </div>

  <!-- Profile -->
  <div class="p-6 border-t">
    <div class="flex items-center space-x-3">
      <img src="/assets/profile.png" alt="Admin" class="h-10 w-10 rounded-full border" />
      <div>
        <p class="font-semibold text-[#1E4B87]">Admin Name</p>
        <p class="text-sm text-gray-500">Administrator</p>
      </div>
    </div>
    <button
      id="logout-btn"
      class="mt-4 w-full text-sm bg-[#F47C2B] text-white font-semibold py-2 rounded-lg hover:bg-[#e36e21] transition"
    >
      Log Out
    </button>
  </div>
</aside>


    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[#1E4B87]">Teachers</h1>
        <button id="addTeacherBtn" class="bg-[#F47C2B] text-white px-4 py-2 rounded-lg font-semibold hover:bg-[#e36e21]">+ Add Teacher</button>
      </div>

      <!-- Teachers Grid -->
      <div id="teacherGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Modal -->
    <div id="teacherModal" class="hidden fixed inset-0 bg-black bg-opacity-40 items-center justify-center z-50">
      <div class="bg-white w-full max-w-lg p-6 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-semibold text-[#1E4B87] mb-4">Add Teacher</h2>
        <form id="teacherForm" class="space-y-4">
          <input type="hidden" id="teacherId" />
          <div>
            <label class="block text-sm font-medium">Full Name</label>
            <input id="teacherName" type="text" required class="mt-1 w-full border rounded-lg px-4 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium">Email</label>
            <input id="teacherEmail" type="email" required class="mt-1 w-full border rounded-lg px-4 py-2" />
          </div>
          <div>
            <label class="block text-sm font-medium">Advisory Section</label>
            <input id="teacherAdvisory" type="text" class="mt-1 w-full border rounded-lg px-4 py-2" placeholder="e.g., Grade 4" />
          </div>
          <div>
            <label class="block text-sm font-medium">Photo</label>
            <input id="teacherPhoto" type="file" accept="image/*" class="mt-1 w-full" />
            <img id="teacherPreview" class="mt-3 w-20 h-20 rounded-full object-cover hidden" />
          </div>
          <div class="flex justify-end space-x-3">
            <button type="button" id="cancelTeacherModal" class="px-4 py-2 bg-gray-200 rounded-lg">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-[#F47C2B] text-white rounded-lg">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const modal = document.getElementById('teacherModal');
      const addBtn = document.getElementById('addTeacherBtn');
      const cancelBtn = document.getElementById('cancelTeacherModal');
      const form = document.getElementById('teacherForm');
      const grid = document.getElementById('teacherGrid');
      const photoInput = document.getElementById('teacherPhoto');
      const preview = document.getElementById('teacherPreview');

      let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
      let uploadedPhoto = '';

      const saveData = () => localStorage.setItem('teachers', JSON.stringify(teachers));

      const renderTeachers = () => {
        grid.innerHTML = '';
        if (!teachers.length) {
          grid.innerHTML = `<p class="text-gray-500 col-span-full">No teachers added yet.</p>`;
          return;
        }
        teachers.forEach(t => {
          const card = document.createElement('div');
          card.className = 'bg-white p-5 rounded-2xl shadow hover:shadow-lg transition';
          card.innerHTML = `
            <div class="flex items-center space-x-3">
              <img src="${t.photo || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full object-cover">
              <div>
                <h2 class="text-xl font-semibold text-[#1E4B87]">${t.name}</h2>
                <p class="text-sm text-gray-600">Email: ${t.email}</p>
                <p class="text-sm text-gray-600">Advisory: ${t.advisory || '-'}</p>
              </div>
            </div>
            <div class="flex justify-end mt-4 space-x-3">
              <button class="text-[#1E4B87]" onclick="editTeacher(${t.id})">✏️</button>
              <button class="text-red-500" onclick="deleteTeacher(${t.id})">🗑️</button>
            </div>`;
          grid.appendChild(card);
        });
      };

      // Photo preview
      photoInput.onchange = e => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = ev => {
            uploadedPhoto = ev.target.result;
            preview.src = uploadedPhoto;
            preview.classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        }
      };

      // Modal handlers
      addBtn.onclick = () => {
        form.reset(); uploadedPhoto = ''; preview.classList.add('hidden');
        document.getElementById('teacherId').value = '';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      };
      cancelBtn.onclick = () => modal.classList.add('hidden');

      form.onsubmit = e => {
        e.preventDefault();
        const id = document.getElementById('teacherId').value;
        const data = {
          id: id || Date.now(),
          name: document.getElementById('teacherName').value,
          email: document.getElementById('teacherEmail').value,
          advisory: document.getElementById('teacherAdvisory').value,
          photo: uploadedPhoto
        };
        if (id) teachers = teachers.map(t => t.id == id ? data : t);
        else teachers.push(data);
        saveData(); renderTeachers(); modal.classList.add('hidden');
      };

      window.editTeacher = id => {
        const t = teachers.find(x => x.id == id);
        document.getElementById('teacherId').value = t.id;
        document.getElementById('teacherName').value = t.name;
        document.getElementById('teacherEmail').value = t.email;
        document.getElementById('teacherAdvisory').value = t.advisory;
        uploadedPhoto = t.photo;
        if (uploadedPhoto) { preview.src = uploadedPhoto; preview.classList.remove('hidden'); }
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      };

      window.deleteTeacher = id => {
        if (confirm('Delete this teacher?')) {
          teachers = teachers.filter(t => t.id != id);
          saveData(); renderTeachers();
        }
      };

      renderTeachers();
    </script>
  </body>
</html>
