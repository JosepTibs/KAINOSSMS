<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMS</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm sticky">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <!-- Logo -->
          <div class="flex-shrink-0">
            <a href="#" class="text-2xl font-bold text-orange-400">Kainos</a>
          </div>

          <!-- Desktop Menu -->
          <div class="hidden md:flex space-x-8">
            <a
              href="/admin/index.html"
              class="text-gray-700 hover:text-orange-400 font-medium"
              >Dashboard</a
            >
            <a
              href="/admin/teachers.html"
              class="text-gray-700 hover:text-orange-400 font-medium"
              >Teachers</a
            >
            <a
              href="/admin/students.html"
              class="text-gray-700 hover:text-orange-400 font-medium"
              >Students</a
            >
            <a
              href="/admin/parents.html"
              class="text-gray-700 hover:text-orange-400 font-medium"
              >Parents</a
            >
            <a
              href="/admin/announcements.html"
              class="text-gray-700 hover:text-orange-400 font-medium"
              >Announcements</a
            >
          </div>

          <!-- Mobile Menu Button -->
          <div class="md:hidden">
            <button
              id="menu-btn"
              class="text-gray-700 hover:text-orange-400 focus:outline-none"
            >
              <!-- Hamburger icon -->
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 6h16M4 12h16M4 18h16"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div
        id="mobile-menu"
        class="hidden md:hidden px-5 pt-5 pb-2 space-y-2 bg-white border-t transition-all duration-300 ease-in-out"
        style="position: absolute; top: 64px; left: 0; width: 100%; z-index: 50"
      >
        <a
          href="/admin/index.html"
          class="block text-gray-700 hover:text-orange-400 font-medium size-10"
        >
          <div class="min-w-screen border">Dashboard</div>
        </a>
        <a
          href="/admin/teachers.html"
          class="block text-gray-700 hover:text-orange-400 font-medium size-10"
        >
          <div class="min-w-screen border">Teachers</div>
        </a>
        <a
          href="/admin/parents.html"
          class="block text-gray-700 hover:text-orange-400 font-medium size-10"
        >
          <div class="min-w-screen border">Parents</div>
        </a>
        <a
          href="/admin/students.html"
          class="block text-gray-700 hover:text-orange-400 font-medium size-10"
        >
          <div class="min-w-screen border">Students</div>
        </a>
        <a
          href="/admin/announcements.html"
          class="block text-gray-700 hover:text-orange-400 font-medium size-10"
        >
          <div class="min-w-screen border">Announcements</div>
        </a>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="dashboard-content">
      <h1 id="teachers_cont" class="text-3xl font-medium">Teachers</h1>
    </div>

    

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="teacher cards.js"></script>
  </body>
</html>
