<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements - Kainos</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen flex bg-[#fdf9f2] text-[#333]">
  <body class="min-h-screen bg-[#fdf9f2] text-[#333] relative">
    <!-- ✅ Navbar Placeholder -->
    <div id="navbar-placeholder"></div>



    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[#1E4B87]">Announcements</h1>
      </div>

      <!-- Announcements Grid -->
      <div id="announcementGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- JavaScript -->
    <script>
      const grid = document.getElementById("announcementGrid");
      const announcements = JSON.parse(localStorage.getItem("announcements")) || [];

      const renderAnnouncements = () => {
        grid.innerHTML = "";

        if (!announcements.length) {
          grid.innerHTML = `
            <p class="text-gray-500 col-span-full text-center bg-white p-6 rounded-2xl shadow">
              No announcements yet.
            </p>`;
          return;
        }

        announcements
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .forEach((a) => {
            const card = document.createElement("div");
            card.className =
              "bg-white p-5 rounded-2xl shadow hover:shadow-lg transition";
            card.innerHTML = `
              ${
                a.image
                  ? `<img src="${a.image}" class="rounded-lg mb-3 w-full h-40 object-cover">`
                  : ""
              }
              <h2 class="text-xl font-semibold text-[#1E4B87]">${a.title}</h2>
              <p class="text-gray-600 text-sm mt-2">${a.desc}</p>
              <p class="text-gray-500 text-xs mt-2">📅 ${a.date}</p>
            `;
            grid.appendChild(card);
          });
      };

      renderAnnouncements();
    </script>
    <!-- ✅ Load Shared Navbar -->
    <script>
      fetch("/parent/components/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          const placeholder = document.getElementById("navbar-placeholder");
          placeholder.innerHTML = html;

          // ✅ Attach sidebar toggle logic AFTER navbar is loaded
          const menuToggle = document.getElementById("menuToggle");
          const mobileSidebar = document.getElementById("mobileSidebar");
          const sidebarContent = document.getElementById("mobileSidebarContent");
          const closeSidebar = document.getElementById("closeSidebar");

          menuToggle?.addEventListener("click", () => {
            mobileSidebar.classList.remove("hidden");
            setTimeout(() => sidebarContent.classList.remove("-translate-x-full"), 10);
          });

          closeSidebar?.addEventListener("click", () => {
            sidebarContent.classList.add("-translate-x-full");
            setTimeout(() => mobileSidebar.classList.add("hidden"), 300);
          });

          mobileSidebar?.addEventListener("click", (e) => {
            if (e.target === mobileSidebar) {
              sidebarContent.classList.add("-translate-x-full");
              setTimeout(() => mobileSidebar.classList.add("hidden"), 300);
            }
          });
        });
    </script>

  </body>
</html>
