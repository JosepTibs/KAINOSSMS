<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Dashboard - Kainos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="/public/KainosLogo.png">
  </head>

  <body class="min-h-screen bg-[#fdf9f2] text-[#333] relative">
    <!-- ✅ Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- ✅ Main Content -->
    <main class="pt-16 md:pt-0 md:ml-64 p-6 overflow-y-auto transition-all duration-300">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[#1E4B87]">Welcome, Parent!</h1>
      </div>

      <!-- 🧑‍👩 Parent Profile -->
      <section class="bg-white p-6 rounded-2xl shadow mb-10">
        <h2 class="text-2xl font-semibold text-[#1E4B87] mb-4">Parent Profile</h2>
        <div class="flex items-center space-x-6">
          <img src="/assets/profile.png" alt="Parent Profile" class="h-20 w-20 rounded-full border" />
          <div>
            <p class="text-xl font-semibold text-[#1E4B87]">Maria Dela Cruz</p>
            <p class="text-gray-600">Email: maria.delacruz@example.com</p>
            <p class="text-gray-600">Contact: 0917-123-4567</p>
            <p class="text-gray-600">Children: 2</p>
          </div>
        </div>
      </section>

      <!-- 👧 Children -->
      <section class="mb-10">
        <h2 class="text-2xl font-semibold text-[#1E4B87] mb-4">My Children</h2>
        <div id="childrenGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>

      <!-- 📢 Announcements -->
      <section class="bg-white p-6 rounded-2xl shadow">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-semibold text-[#1E4B87]">Recent Announcements</h2>
          <a href="/parent/announcements.html" class="text-[#F47C2B] font-medium hover:underline">View All</a>
        </div>
        <div id="announcementGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>
    </main>

    <!-- ✅ Load Shared Navbar -->
    <script>
      fetch("/parent/components/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          const placeholder = document.getElementById("navbar-placeholder");
          placeholder.innerHTML = html;

          // ✅ Attach sidebar toggle logic AFTER navbar is loaded
          const menuToggle = document.getElementById("menuToggle");
          const mobileSidebar = document.getElementById("mobileSidebar");
          const sidebarContent = document.getElementById("mobileSidebarContent");
          const closeSidebar = document.getElementById("closeSidebar");

          menuToggle?.addEventListener("click", () => {
            mobileSidebar.classList.remove("hidden");
            setTimeout(() => sidebarContent.classList.remove("-translate-x-full"), 10);
          });

          closeSidebar?.addEventListener("click", () => {
            sidebarContent.classList.add("-translate-x-full");
            setTimeout(() => mobileSidebar.classList.add("hidden"), 300);
          });

          mobileSidebar?.addEventListener("click", (e) => {
            if (e.target === mobileSidebar) {
              sidebarContent.classList.add("-translate-x-full");
              setTimeout(() => mobileSidebar.classList.add("hidden"), 300);
            }
          });
        });
    </script>

    <!-- ✅ Page Scripts -->
    <script>
      const children = JSON.parse(localStorage.getItem("students")) || [];
      const announcements = JSON.parse(localStorage.getItem("announcements")) || [];

      const childrenGrid = document.getElementById("childrenGrid");
      const announcementGrid = document.getElementById("announcementGrid");

      function renderChildren() {
        childrenGrid.innerHTML = "";
        if (!children.length) {
          childrenGrid.innerHTML =
            '<p class="text-gray-500 col-span-full text-center">No children added yet.</p>';
          return;
        }

        children
          .sort((a, b) => a.grade - b.grade)
          .forEach((child) => {
            const card = document.createElement("div");
            card.className =
              "bg-white p-5 rounded-2xl shadow hover:shadow-lg transition flex flex-col items-center text-center";
            card.innerHTML = `
              <img src="${child.photo || "/assets/default-avatar.png"}" class="w-24 h-24 rounded-full object-cover mb-4 border">
              <h3 class="text-xl font-semibold text-[#1E4B87]">${child.name}</h3>
              <p class="text-gray-600">Grade ${child.grade}</p>
              <p class="text-gray-500 text-sm mt-2">Progress: ${child.progress || "Pending"}</p>
            `;
            childrenGrid.appendChild(card);
          });
      }

      function renderAnnouncements() {
        announcementGrid.innerHTML = "";
        if (!announcements.length) {
          announcementGrid.innerHTML =
            '<p class="text-gray-500 col-span-full text-center">No announcements yet.</p>';
          return;
        }

        announcements
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .slice(0, 3)
          .forEach((a) => {
            const card = document.createElement("div");
            card.className =
              "bg-[#fdf2e9] p-5 rounded-2xl border border-[#F47C2B]/30 hover:shadow-md transition";
            card.innerHTML = `
              ${a.image ? `<img src="${a.image}" class="rounded-lg mb-3 w-full h-40 object-cover">` : ""}
              <h2 class="text-xl font-semibold text-[#1E4B87]">${a.title}</h2>
              <p class="text-gray-600 text-sm mt-2">${a.desc}</p>
              <p class="text-gray-500 text-xs mt-2">📅 ${a.date}</p>
            `;
            announcementGrid.appendChild(card);
          });
      }

      renderChildren();
      renderAnnouncements();
    </script>
  </body>
</html>
